<!doctype html>
<html lang="en" data-bs-theme="dark">
{% load static %}

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock %} - Premium Scope Management for Media Personal</title>
    <meta name="description"
        content="Scope Agreement helps freelance videographers clearly define project scope, track revisions automatically, and keep every client on the same page." />

    <!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}" />
</head>

<body>
    <!-- ===== Loading Screen ===== -->
    <!-- <div id="loader" class="loader">
        <div class="loader-logo">
            <span class="loader-mark"><i class="bi bi-camera-reels"></i></span>
            <span class="loader-text">Scope Agreement</span>
        </div>
        <div class="loader-bar"><span></span></div>
    </div> -->

    <!-- ===== App Root ===== -->
    <div id="app"></div>

    <!-- ===== Toast Container ===== -->
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" style="z-index: 1090"></div>

    <!-- ===== Scroll to Top ===== -->
    <button id="scrollTop" class="scroll-top" aria-label="Scroll to top">
        <i class="bi bi-arrow-up"></i>
    </button>

    <!-- ===== Landing Page ===== -->
    <div id="landing" class="landing">
        {%include 'website/partial/header.html' %}
        {% block content %}
        {% endblock %}
        {%include 'website/partial/footer.html' %}
    </div>


    <!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <!-- App -->
    <script type="module" src="{% static 'JS/main.js' %}"></script>
</body>

</html>
